name: Update profile data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install animation generator dependency
        run: python -m pip install Pillow

      - name: Generate animated profile assets
        run: python scripts/create-profile-animations.py

      - name: Regenerate public repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit updated profile data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ scripts/create-profile-animations.py scripts/update-profile.mjs
          git diff --cached --quiet || git commit -m "Update profile repository data"
          git push
