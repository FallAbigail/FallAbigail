name: Update profile data

on:
  schedule:
    - cron: "2-57/5 * * * *"
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: profile-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '23 5 * * *' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install animation generator dependency
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '23 5 * * *' }}
        run: python -m pip install Pillow

      - name: Generate animated profile assets
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '23 5 * * *' }}
        run: python scripts/create-profile-animations.py

      - name: Regenerate public repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit updated profile data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ scripts/create-profile-animations.py scripts/update-profile.mjs
          git diff --cached --quiet || git commit -m "Update profile repository data"
          git push
